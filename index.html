<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First & Dream · Wedding Camera TEST</title>
<style>
:root{--ink:#17362c;--green:#1e6248;--paper:#fffdf4;--sky:#dff3fa;--line:#78917f}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:system-ui,"Noto Sans Thai",sans-serif}main{width:min(680px,100%);margin:auto;padding:22px 18px 48px}header{text-align:center;margin:10px 0 24px}h1{font-family:Georgia,serif;margin:.2rem;font-size:clamp(2rem,8vw,3.4rem)}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 #b6d4cf;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 5px}input,button{font:inherit;width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);padding:10px 14px}button{background:var(--green);color:white;font-weight:800;cursor:pointer}button.secondary{background:transparent;color:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}video,img{display:block;width:100%;border-radius:18px;margin:14px 0;background:#111;max-height:65vh;object-fit:contain}#shutter{width:72px;height:72px;min-height:72px;border:8px solid white;border-radius:50%;margin:-100px auto 40px;position:relative;box-shadow:0 0 0 2px #123;background:#e7cda5}#status{white-space:pre-wrap;background:#fffbea;border-left:5px solid #d9aa52;padding:12px;margin-top:16px}small{display:block;line-height:1.5}.hidden{display:none!important}.controls{padding:10px 0}.controls input{min-height:30px;padding:0}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.filters button{min-width:118px;width:auto;background:white;color:var(--ink);font-size:.85rem}.filters button[aria-pressed="true"]{background:var(--green);color:white}.meta{text-align:center;font-size:.85rem}.f-original{filter:none}.f-golden{filter:contrast(1.06) saturate(1.13) sepia(.14) brightness(1.04)}.f-soft{filter:contrast(.92) saturate(.95) brightness(1.08) sepia(.05)}.f-chrome{filter:contrast(1.18) saturate(.72) brightness(.98)}.f-nostalgic{filter:contrast(1.12) saturate(.88) sepia(.12) hue-rotate(-8deg)}.f-night{filter:contrast(1.16) saturate(1.18) brightness(1.05)}.f-mono{filter:grayscale(1) contrast(1.12)}@media(max-width:480px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><main>
<header><small>รุ่นทดสอบส่วนตัว · ห้ามแจกแขก</small><h1>First &amp; Dream</h1><div>22 พฤศจิกายน 2569</div><p>ช่วยเก็บวันนี้ในมุมของคุณ</p></header>
<section class="card" id="joinCard"><h2>รับกล้องทดสอบ</h2><form id="join"><label for="nickname">ชื่อเล่น</label><input id="nickname" maxlength="40" required><label for="access">รหัสทดสอบ</label><input id="access" type="password" minlength="16" required><button style="margin-top:16px">รับกล้อง</button></form></section>
<section class="card hidden" id="cameraCard"><h2 id="cameraName">กล้องของคุณ</h2><p id="counts"></p><div class="row"><button id="start">เปิดกล้องสด</button><button id="switch" class="secondary" disabled>สลับกล้อง</button></div><div id="liveControls" class="controls hidden"><label id="zoomLabel" class="hidden">ซูม <span id="zoomValue">1×</span><input id="zoom" type="range"></label><button id="torch" class="secondary hidden">เปิดไฟช่วยถ่าย</button></div><video id="video" autoplay playsinline muted class="hidden"></video><button id="shutter" class="hidden" aria-label="ถ่ายภาพ"></button><img id="preview" class="hidden" alt="ภาพที่รอยืนยัน"><div id="photoMeta" class="meta hidden"></div><div id="filterPanel" class="hidden"><label>เลือกโทนภาพ</label><div class="filters" id="filters"></div></div><div class="row hidden" id="review"><button id="retake" class="secondary">ถ่ายใหม่</button><button id="send">ใช้ภาพนี้และส่ง</button></div><button id="retry" class="hidden" style="margin-top:12px">ตรวจสถานะและลองส่งเดิม</button></section>
<div id="status" role="status">กำลังตรวจระบบ…</div><iframe name="bridgeFrame" id="bridgeFrame" class="hidden" title="ระบบส่งภาพ"></iframe>
</main><script>
const API='https://script.google.com/macros/s/AKfycbynKzbU2pTSvJK0SUauDUQ38xVpzKedlqrregzHTgVevb7drrZeumW1MS_zcgcuO1pY/exec';
const ORIGIN=location.origin, $=id=>document.getElementById(id), errors={CLOSED:'ระบบยังปิดรับภาพ',SETUP:'ระบบยังตั้งค่าไม่ครบ',ACCESS:'รหัสหรือเว็บไซต์ต้นทางไม่ถูกต้อง',NAME:'กรุณากรอกชื่อเล่น',LIMIT:'ใช้สิทธิ์ครบแล้ว',BUSY:'ระบบกำลังประมวลผล',AUTH:'ข้อมูลกล้องไม่ถูกต้อง',IMAGE:'ไฟล์ภาพไม่ถูกต้อง',MISMATCH:'ข้อมูลภาพไม่ตรงกัน',RETRY:'เชื่อมต่อไม่สำเร็จ กรุณาลองอีกครั้ง'};
const FILTERS={original:{label:'Original',css:'none'},golden:{label:'Golden Day',css:'contrast(1.06) saturate(1.13) sepia(.14) brightness(1.04)'},soft:{label:'Soft Romance',css:'contrast(.92) saturate(.95) brightness(1.08) sepia(.05)'},chrome:{label:'Story Chrome',css:'contrast(1.18) saturate(.72) brightness(.98)'},nostalgic:{label:'Nostalgic Green',css:'contrast(1.12) saturate(.88) sepia(.12) hue-rotate(-8deg)'},night:{label:'Night Flash',css:'contrast(1.16) saturate(1.18) brightness(1.05)'},mono:{label:'Timeless Mono',css:'grayscale(1) contrast(1.12)'}};
let settings,credential,stream,draft,pending,busy=false,facing='environment',filter='original',torchOn=false,imageUrl;const waits=new Map();
function message(v){$('status').textContent=v}function uuid(){return crypto.randomUUID()}
window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&& !e.origin.endsWith('.googleusercontent.com'))return;let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch{return}}if(d?.source!=='df-wedding-bridge-v1')return;const w=waits.get(d.requestId);if(w){waits.delete(d.requestId);clearTimeout(w.timer);d.result?.ok?w.resolve(d.result.data):w.reject(new Error(errors[d.result?.code]||errors.RETRY));}});
function rpc(operation,payload={}){return new Promise((resolve,reject)=>{const id=uuid(),form=document.createElement('form');form.method='POST';form.action=API;form.target='bridgeFrame';form.enctype='multipart/form-data';for(const [k,v] of Object.entries({operation,origin:ORIGIN,bridgeRequestId:id,payload:JSON.stringify(payload)})){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)}document.body.appendChild(form);const timer=setTimeout(()=>{waits.delete(id);form.remove();reject(new Error('หมดเวลารอเซิร์ฟเวอร์'))},45000);waits.set(id,{resolve:v=>{form.remove();resolve(v)},reject:e=>{form.remove();reject(e)},timer});form.submit();});}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;torchOn=false;$('video').classList.add('hidden');$('shutter').classList.add('hidden');$('switch').disabled=true;$('liveControls').classList.add('hidden');$('zoomLabel').classList.add('hidden');$('torch').classList.add('hidden')}
function showCounts(c){$('counts').textContent=`เหลือ ${c.remaining} / ${c.limit} ภาพ · ถ่ายเพิ่มได้ ${c.available}`;$('cameraName').textContent='กล้องของ '+c.nickname}
async function start(){try{if(busy||draft||pending)return;stop();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:4096},height:{ideal:2160}}});$('video').srcObject=stream;await $('video').play();const track=stream.getVideoTracks()[0],cap=track.getCapabilities?track.getCapabilities():{};$('video').classList.remove('hidden');$('shutter').classList.remove('hidden');$('switch').disabled=false;$('liveControls').classList.remove('hidden');if(cap.zoom&&Number.isFinite(cap.zoom.min)){Object.assign($('zoom'),{min:cap.zoom.min,max:cap.zoom.max,step:cap.zoom.step||.1,value:track.getSettings().zoom||cap.zoom.min});$('zoomValue').textContent=Number($('zoom').value).toFixed(1)+'×';$('zoomLabel').classList.remove('hidden')}if(cap.torch&&facing==='environment')$('torch').classList.remove('hidden');const s=track.getSettings();message(`เปิดกล้องสดแล้ว · พรีวิว ${s.width||'?'}×${s.height||'?'}`)}catch(e){stop();message('เปิดกล้องไม่ได้: '+e.name+' กรุณาตรวจสิทธิ์กล้องของเบราว์เซอร์')}}
function blob64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function loadImage(blob){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(blob);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
async function toBlob(canvas,quality){return new Promise(res=>canvas.toBlob(res,'image/jpeg',quality))}
async function filteredBlob(blob){const img=await loadImage(blob);let scale=1,quality=settings.jpegQuality||.92,out;for(let pass=0;pass<8;pass++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.filter=FILTERS[filter].css;x.drawImage(img,0,0,c.width,c.height);out=await toBlob(c,quality);if(out.size<=settings.maxBytes)return out;if(quality>.74)quality-=.06;else scale*=.85}throw new Error('ภาพใหญ่เกินขนาดที่ระบบรับได้')}
async function preview(blob){draft=blob;stop();if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(blob);$('preview').src=imageUrl;$('preview').className='f-'+filter;$('preview').classList.remove('hidden');const img=await loadImage(blob);$('photoMeta').textContent=`${img.naturalWidth}×${img.naturalHeight} · ${(blob.size/1048576).toFixed(1)} MB`;$('photoMeta').classList.remove('hidden');$('filterPanel').classList.remove('hidden');$('review').classList.remove('hidden');message('เลือกโทนภาพก่อนยืนยัน การถ่ายใหม่ยังไม่หักสิทธิ์')}
async function transmit(){if(!pending||busy)return;busy=true;try{const r=await rpc('uploadPhoto',{credential,requestId:pending.id,base64:await blob64(pending.blob)});pending=null;draft=null;localStorage.removeItem('dfPendingMeta');$('preview').classList.add('hidden');$('photoMeta').classList.add('hidden');$('filterPanel').classList.add('hidden');$('review').classList.add('hidden');$('retry').classList.add('hidden');showCounts(r.counts);message('บันทึกภาพใน Drive สำเร็จ')}catch(e){$('retry').classList.remove('hidden');message(e.message+'\nภาพยังรอส่งเดิม กรุณาอย่าถ่ายเพิ่ม')}finally{busy=false}}
$('join').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('createCamera',{nickname:$('nickname').value,accessCode:$('access').value});credential=r.credential;localStorage.setItem('dfCredential',JSON.stringify(credential));$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');showCounts(r.counts);$('access').value='';message('รับกล้องแล้ว กดเปิดกล้องสด')}catch(e){message(e.message)}};
$('start').onclick=start;$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('zoom').oninput=async e=>{const track=stream?.getVideoTracks()[0];if(!track)return;try{await track.applyConstraints({advanced:[{zoom:Number(e.target.value)}]});$('zoomValue').textContent=Number(e.target.value).toFixed(1)+'×'}catch{message('อุปกรณ์นี้ปรับซูมผ่านเว็บไม่ได้')}};$('torch').onclick=async()=>{const track=stream?.getVideoTracks()[0];if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});$('torch').textContent=torchOn?'ปิดไฟช่วยถ่าย':'เปิดไฟช่วยถ่าย'}catch{torchOn=false;message('อุปกรณ์นี้เปิดไฟช่วยถ่ายผ่านเว็บไม่ได้')}};
$('shutter').onclick=async()=>{if(busy)return;busy=true;try{const track=stream.getVideoTracks()[0];let blob;if(window.ImageCapture){try{blob=await new ImageCapture(track).takePhoto()}catch{}}if(!blob){const v=$('video'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);blob=await toBlob(c,settings.jpegQuality)}await preview(blob)}catch(e){message('ถ่ายภาพไม่ได้: '+e.message)}finally{busy=false}};
for(const [id,p] of Object.entries(FILTERS)){const b=document.createElement('button');b.type='button';b.textContent=p.label;b.dataset.filter=id;b.setAttribute('aria-pressed',id===filter);b.onclick=()=>{filter=id;$('preview').className='f-'+id;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.filter===id))};$('filters').appendChild(b)}
$('retake').onclick=()=>{draft=null;$('preview').classList.add('hidden');$('photoMeta').classList.add('hidden');$('filterPanel').classList.add('hidden');$('review').classList.add('hidden');message('ถ่ายใหม่ได้ ยังไม่หักสิทธิ์')};$('send').onclick=async()=>{if(!draft||pending||busy)return;busy=true;try{message('กำลังแต่งและปรับขนาดภาพ…');const ready=await filteredBlob(draft);pending={id:uuid(),blob:ready};$('review').classList.add('hidden');$('retry').classList.remove('hidden')}catch(e){message(e.message);busy=false;return}busy=false;await transmit()};$('retry').onclick=transmit;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
(async()=>{try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('เบราว์เซอร์นี้ไม่รองรับกล้องสด');settings=await rpc('getSettings');const saved=localStorage.getItem('dfCredential');if(saved){credential=JSON.parse(saved);const c=await rpc('getCamera',{credential});$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');showCounts(c);message('กลับมาใช้กล้องเดิมได้แล้ว')}else message('พร้อมรับกล้องทดสอบ')}catch(e){message(e.message)}})();
</script></body></html>
