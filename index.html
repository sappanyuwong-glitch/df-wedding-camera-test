<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First & Dream · Wedding Camera</title>
<style>
:root{--ink:#17362c;--green:#1e6248;--paper:#fffdf4;--sky:#dff3fa;--line:#78917f}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:system-ui,"Noto Sans Thai",sans-serif}main{width:min(680px,100%);margin:auto;padding:22px 18px 48px}header{text-align:center;margin:10px 0 24px}h1{font-family:Georgia,serif;margin:.2rem;font-size:clamp(2rem,8vw,3.4rem)}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 #b6d4cf;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 5px}input,button{font:inherit;width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);padding:10px 14px}button{background:var(--green);color:white;font-weight:800;cursor:pointer}button.secondary{background:transparent;color:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}video,img{display:block;width:100%;border-radius:18px;margin:14px 0;background:#111;max-height:65vh;object-fit:contain}#shutter{width:72px;height:72px;min-height:72px;border:8px solid white;border-radius:50%;margin:-100px auto 40px;position:relative;box-shadow:0 0 0 2px #123;background:#e7cda5}#status{white-space:pre-wrap;background:#fffbea;border-left:5px solid #d9aa52;padding:12px;margin-top:16px}small{display:block;line-height:1.5}.hidden{display:none!important}.controls{padding:10px 0}.controls input{min-height:30px;padding:0}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.filters button{min-width:118px;width:auto;background:white;color:var(--ink);font-size:.85rem}.filters button[aria-pressed="true"]{background:var(--green);color:white}.meta{text-align:center;font-size:.85rem}.f-original{filter:none}.f-golden{filter:contrast(1.06) saturate(1.13) sepia(.14) brightness(1.04)}.f-soft{filter:contrast(.92) saturate(.95) brightness(1.08) sepia(.05)}.f-chrome{filter:contrast(1.18) saturate(.72) brightness(.98)}.f-nostalgic{filter:contrast(1.12) saturate(.88) sepia(.12) hue-rotate(-8deg)}.f-night{filter:contrast(1.16) saturate(1.18) brightness(1.05)}.f-mono{filter:grayscale(1) contrast(1.12)}@media(max-width:480px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><main>
<header><small>กล้องเก็บความทรงจำวันแต่งงาน</small><h1>First &amp; Dream</h1><div>22 พฤศจิกายน 2569</div><p>ช่วยเก็บวันนี้ในมุมของคุณ</p></header>
<section class="card" id="joinCard"><h2>รับกล้อง</h2><form id="join"><label for="nickname">ชื่อเล่น</label><input id="nickname" maxlength="40" required><label for="access">รหัสเข้างาน</label><input id="access" type="password" minlength="6" required><button style="margin-top:16px">รับกล้อง</button></form></section>
<section class="card hidden" id="cameraCard"><h2 id="cameraName">กล้องของคุณ</h2><p id="counts"></p><button id="newRoll" class="hidden" style="margin-bottom:12px">รับฟิล์มม้วนใหม่ 36 ภาพ</button><div class="row"><button id="start">เปิดกล้องสด</button><button id="switch" class="secondary" disabled>สลับกล้อง</button></div><button id="pick" type="button" class="secondary" style="margin-top:10px">เลือกภาพที่ถ่ายไว้แล้ว</button><input id="filePick" type="file" accept="image/*" class="hidden"><div id="liveControls" class="controls hidden"><label id="zoomLabel" class="hidden">ซูม <span id="zoomValue">1×</span><input id="zoom" type="range"></label><button id="torch" class="secondary hidden">เปิดไฟช่วยถ่าย</button></div><video id="video" autoplay playsinline muted class="hidden"></video><button id="shutter" class="hidden" aria-label="ถ่ายภาพ"></button><img id="preview" class="hidden" alt="ภาพที่รอยืนยัน"><div id="photoMeta" class="meta hidden"></div><div id="filterPanel" class="hidden"><label>เลือกโทนภาพ</label><div class="filters" id="filters"></div></div><div class="row hidden" id="review"><button id="retake" class="secondary">ยกเลิกภาพนี้</button><button id="send">ใช้ภาพนี้และส่ง</button></div><button id="retry" class="hidden" style="margin-top:12px">ลองอัปโหลดภาพนี้อีกครั้ง</button></section>
<div id="status" role="status">กำลังเริ่มระบบ… หากหน้านี้ไม่เปลี่ยน กรุณาปิดหน้ากล้องอื่นแล้วเปิดลิงก์ล่าสุดอีกครั้ง</div><button id="reconnect" class="secondary hidden" style="margin-top:10px">ลองเชื่อมต่ออีกครั้ง</button><iframe name="bridgeFrame" id="bridgeFrame" class="hidden" title="ระบบส่งภาพ"></iframe>
</main><script>
const API='https://script.google.com/macros/s/AKfycbx9vXbp_lJzdj-V7ie9RTSq7dM5LCa2gwiLtuWRNwx2QpNo5jVXqa-nVENZ6Dbb43bdLg/exec';
const ORIGIN=location.origin, $=id=>document.getElementById(id), errors={OFFLINE:'กรุณาเชื่อมต่ออินเทอร์เน็ต',TIMEOUT:'กำลังเชื่อมต่อใหม่',ROLL_NOT_READY:'กรุณาส่งภาพม้วนเดิมให้ครบก่อนรับม้วนใหม่',CLOSED:'ระบบยังปิดรับภาพ',SETUP:'ระบบยังตั้งค่าไม่ครบ',ACCESS:'รหัสหรือเว็บไซต์ต้นทางไม่ถูกต้อง',NAME:'กรุณากรอกชื่อเล่น',LIMIT:'ใช้สิทธิ์ครบแล้ว',BUSY:'ระบบกำลังประมวลผล',AUTH:'ข้อมูลกล้องไม่ถูกต้อง',IMAGE:'ไฟล์ภาพไม่ถูกต้อง',MISMATCH:'ข้อมูลภาพไม่ตรงกัน',RETRY:'เชื่อมต่อไม่สำเร็จ กรุณาลองอีกครั้ง'};
const FILTERS={original:{label:'Original',css:'none'},golden:{label:'Golden Day',css:'contrast(1.06) saturate(1.13) sepia(.14) brightness(1.04)'},soft:{label:'Soft Romance',css:'contrast(.92) saturate(.95) brightness(1.08) sepia(.05)'},chrome:{label:'Story Chrome',css:'contrast(1.18) saturate(.72) brightness(.98)'},nostalgic:{label:'Nostalgic Green',css:'contrast(1.12) saturate(.88) sepia(.12) hue-rotate(-8deg)'},night:{label:'Night Flash',css:'contrast(1.16) saturate(1.18) brightness(1.05)'},mono:{label:'Timeless Mono',css:'grayscale(1) contrast(1.12)'}};
let settings,credential,stream,draft,pending,busy=false,facing='environment',filter='original',torchOn=false,imageUrl;const waits=new Map();
function message(v){$('status').textContent=v}function uuid(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}
// Persist the exact JPEG and request ID before sending, including across mobile tab eviction.
const APP_EVENT='live-221169-r2',storageKey='dfCredential:'+APP_EVENT;
let photoDB=null;
function connectPhotoDB(){return new Promise((resolve,reject)=>{let settled=false,r;const fail=msg=>{if(settled)return;settled=true;clearTimeout(timer);reject(new Error(msg))};const timer=setTimeout(()=>fail('เปิดพื้นที่เก็บภาพในเครื่องนานเกินไป กรุณาปิดหน้ากล้องอื่นแล้วกดลองเชื่อมต่ออีกครั้ง โดยไม่ล้างข้อมูลเว็บไซต์'),8000);try{r=indexedDB.open('df-photo-outbox-v1',2)}catch(e){fail('เบราว์เซอร์ไม่อนุญาตให้เก็บภาพรอส่งในเครื่อง กรุณาเปิดด้วย Safari และตรวจพื้นที่ว่าง');return}r.onblocked=()=>fail('มีหน้ากล้องรุ่นก่อนเปิดค้างอยู่ กรุณาปิดแท็บกล้องอื่นแล้วกดลองเชื่อมต่ออีกครั้ง');r.onupgradeneeded=()=>{if(settled){r.transaction.abort();return}if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos');if(!r.result.objectStoreNames.contains('meta'))r.result.createObjectStore('meta')};r.onsuccess=()=>{if(settled){r.result.close();return}settled=true;clearTimeout(timer);const db=r.result;db.onversionchange=()=>{db.close();photoDB=null};db.onclose=()=>{photoDB=null};resolve(db)};r.onerror=()=>fail('เปิดพื้นที่บันทึกภาพในเครื่องไม่ได้ กรุณาตรวจพื้นที่ว่างแล้วลองอีกครั้ง โดยไม่ล้างข้อมูลเว็บไซต์')})}
function getPhotoDB(){if(!photoDB){const opening=connectPhotoDB();photoDB=opening;opening.catch(()=>{if(photoDB===opening)photoDB=null})}return photoDB}
function localFailure(code,details){const labels={CAMERA_CHANGED:'กล้องเปลี่ยนจากอีกหน้าต่าง ภาพนี้ยังอยู่บนหน้าจอ กรุณาปิดหน้าต่างกล้องอื่นก่อนลองอีกครั้ง',QUEUE_FULL:'มีภาพรอส่งในเครื่องแล้ว กรุณาส่งภาพที่ค้างให้เสร็จก่อน ภาพใหม่ยังอยู่บนหน้าจอ',STORAGE_FULL:'พื้นที่บันทึกในเครื่องไม่พอ ภาพนี้ยังไม่ได้ส่ง กรุณาเพิ่มพื้นที่ว่างโดยไม่ล้างข้อมูลเว็บไซต์',STORAGE_ERROR:'บันทึกภาพในเครื่องไม่สำเร็จ ภาพนี้ยังอยู่บนหน้าจอ กรุณาลองอีกครั้ง'};const e=new Error(labels[code]||labels.STORAGE_ERROR);e.code=code;if(details)e.details=details;return e}
async function stateChange(fn){const db=await getPhotoDB();return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(['photos','meta'],'readwrite')}catch(e){photoDB=null;reject(localFailure('STORAGE_ERROR'));return}let result,problem;const timer=setTimeout(()=>{problem=localFailure('STORAGE_ERROR');try{tx.abort()}catch{}photoDB=null;reject(problem)},15000);tx.oncomplete=()=>{clearTimeout(timer);problem?reject(problem):resolve(result)};tx.onerror=e=>{problem=problem||e.target?.error||tx.error};tx.onabort=()=>{clearTimeout(timer);const e=problem||tx.error;reject(typeof e?.code==='string'&&e?.message?e:localFailure(e?.name==='QuotaExceededError'?'STORAGE_FULL':'STORAGE_ERROR'))};try{fn(tx,v=>result=v,e=>problem=e)}catch(e){problem=e;tx.abort()}})}
async function active(){return stateChange((tx,done)=>{const r=tx.objectStore('meta').get(storageKey);r.onsuccess=()=>done(r.result)})}
async function joinRequest(nickname){return stateChange((tx,done)=>{const s=tx.objectStore('meta'),r=s.get(storageKey+':join');r.onsuccess=()=>{const v=r.result||{id:uuid(),nickname};s.put(v,storageKey+':join');done(v)}})}
async function remember(next,previous){return stateChange((tx,done,fail)=>{const s=tx.objectStore('meta'),r=s.get(storageKey);r.onsuccess=()=>{const old=r.result;if(old&&old.id!==previous?.id){done(old);return}const p=tx.objectStore('photos').get(previous?.id||'none');p.onsuccess=()=>{if(p.result){fail(localFailure('QUEUE_FULL'));return}s.put(next,storageKey);done(next)}}})}
async function outbox(action,value,target=credential){if(!target||target.event!==APP_EVENT)throw new Error('ข้อมูลกล้องเป็นของงานอื่น');return stateChange((tx,done,fail)=>{const s=tx.objectStore('photos'),m=tx.objectStore('meta').get(storageKey);m.onsuccess=()=>{if(action==='put'&&m.result?.id!==target.id){fail(localFailure('CAMERA_CHANGED'));return}const r=s.get(target.id);r.onsuccess=()=>{const old=r.result;if(action==='put'){const photo={...value,camera:target.id,event:APP_EVENT};if(old&&old.id!==value.id){const next=s.get(target.id+':next');next.onsuccess=()=>{if(next.result&&next.result.id!==value.id){fail(localFailure('QUEUE_FULL'));return}s.put(photo,target.id+':next');done(old)};return}s.put(photo,target.id);done(photo);return}if(action==='remove'&&old?.id===value.id){const next=s.get(target.id+':next');next.onsuccess=()=>{if(next.result){s.put(next.result,target.id);s.delete(target.id+':next')}else s.delete(target.id);done(next.result)};return}done(old)}}})}
function failure(code){const e=new Error(errors[code]||errors.RETRY);e.code=code;return e}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function reliable(operation,payload){const startup=['getSettings','getCamera'].includes(operation),attempts=startup?2:4;let error;for(let i=0;i<attempts;i++){if(navigator.onLine===false)throw failure('OFFLINE');try{return await rpc(operation,payload)}catch(e){error=e;if(!['BUSY','RETRY','TIMEOUT'].includes(e.code))throw e;if(i<attempts-1){message(startup?'กำลังเชื่อมต่อระบบอีกครั้ง…':'ระบบกำลังทยอยเก็บภาพ กรุณารอสักครู่…');await pause(Math.min(12000,1500*2**i)+Math.random()*1500)}}}throw error}
let lastCounts;function controls(){if(!lastCounts)return;const blocked=busy||!!pending||!!draft;$('start').disabled=blocked||lastCounts.available<1;$('pick').disabled=blocked||lastCounts.available<1;$('newRoll').disabled=blocked;$('send').disabled=busy;$('retake').disabled=busy}

window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('.googleusercontent.com'))return;let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch{return}}if(d?.source!=='df-wedding-bridge-v1')return;const w=waits.get(d.requestId);if(w){waits.delete(d.requestId);clearTimeout(w.timer);d.result?.ok?w.resolve(d.result.data):w.reject(failure(d.result?.code||'RETRY'))}});
function rpc(operation,payload={}){return new Promise((resolve,reject)=>{const id=uuid(),form=document.createElement('form'),frame=document.createElement('iframe');frame.name='bridge-'+id;frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;border:0;';frame.setAttribute('aria-hidden','true');frame.title='ส่งข้อมูลภาพ';document.body.appendChild(frame);form.method='POST';form.action=API;form.target=frame.name;form.enctype='multipart/form-data';for(const [k,v] of Object.entries({operation,origin:ORIGIN,bridgeRequestId:id,payload:JSON.stringify(payload)})){const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input)}document.body.appendChild(form);const cleanup=()=>{form.remove();frame.remove()};const timer=setTimeout(()=>{waits.delete(id);cleanup();reject(failure('TIMEOUT'))},['getSettings','getCamera'].includes(operation)?12000:90000);waits.set(id,{resolve:v=>{cleanup();resolve(v)},reject:e=>{cleanup();reject(e)},timer});form.submit()})}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;torchOn=false;$('video').classList.add('hidden');$('shutter').classList.add('hidden');$('switch').disabled=true;$('liveControls').classList.add('hidden');$('zoomLabel').classList.add('hidden');$('torch').classList.add('hidden')}
function showCounts(c){lastCounts=c;$('counts').textContent='ม้วนที่ '+(c.roll||1)+' · เหลือ '+c.remaining+' / '+c.limit+' ภาพ';$('cameraName').textContent='กล้องของ '+c.nickname;$('newRoll').classList.toggle('hidden',c.used!==c.limit||c.reserved>0);controls()}
async function start(){try{if(busy||draft||pending)return;stop();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:4096},height:{ideal:2160}}});$('video').srcObject=stream;await $('video').play();const track=stream.getVideoTracks()[0],cap=track.getCapabilities?track.getCapabilities():{};$('video').classList.remove('hidden');$('shutter').classList.remove('hidden');$('switch').disabled=false;$('liveControls').classList.remove('hidden');if(cap.zoom&&Number.isFinite(cap.zoom.min)){Object.assign($('zoom'),{min:cap.zoom.min,max:cap.zoom.max,step:cap.zoom.step||.1,value:track.getSettings().zoom||cap.zoom.min});$('zoomValue').textContent=Number($('zoom').value).toFixed(1)+'×';$('zoomLabel').classList.remove('hidden')}if(cap.torch&&facing==='environment')$('torch').classList.remove('hidden');const s=track.getSettings();message(`เปิดกล้องสดแล้ว · พรีวิว ${s.width||'?'}×${s.height||'?'}`)}catch(e){stop();message('เปิดกล้องไม่ได้: '+e.name+' กรุณาตรวจสิทธิ์กล้องของเบราว์เซอร์')}}
function blob64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function loadImage(blob){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(blob);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
async function toBlob(canvas,quality){return new Promise(res=>canvas.toBlob(res,'image/jpeg',quality))}
async function filteredBlob(blob){const img=await loadImage(blob);if(img.naturalWidth*img.naturalHeight>50000000)throw new Error('ภาพมีขนาดใหญ่เกินไป กรุณาเลือกรูปไม่เกิน 50 ล้านพิกเซล');let scale=Math.min(1,4096/Math.max(img.naturalWidth,img.naturalHeight)),quality=settings.jpegQuality||.92,out;for(let pass=0;pass<8;pass++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.filter=FILTERS[filter].css;x.drawImage(img,0,0,c.width,c.height);out=await toBlob(c,quality);if(out.size<=settings.maxBytes)return out;if(quality>.74)quality-=.06;else scale*=.85}throw new Error('ภาพใหญ่เกินขนาดที่ระบบรับได้')}
async function preview(blob){if(blob.size>25*1024*1024)throw new Error('กรุณาเลือกภาพไม่เกิน 25 MB');draft=blob;stop();if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(blob);$('preview').src=imageUrl;$('preview').className='f-'+filter;$('preview').classList.remove('hidden');const img=await loadImage(blob);$('photoMeta').textContent=`${img.naturalWidth}×${img.naturalHeight} · ${(blob.size/1048576).toFixed(1)} MB`;$('photoMeta').classList.remove('hidden');$('filterPanel').classList.remove('hidden');$('review').classList.remove('hidden');controls();message('เลือกโทนภาพก่อนยืนยัน การถ่ายใหม่ยังไม่หักสิทธิ์')}
async function transmit(){if(!pending||busy)return;busy=true;let continueQueue=false;const photo=pending,target={...credential};controls();$('retry').disabled=true;message('กำลังเก็บภาพของคุณ กรุณารอสักครู่…');try{let result=await reliable('photoStatus',{credential:target,requestId:photo.id});if(result.state!=='saved')result=await reliable('uploadPhoto',{credential:target,requestId:photo.id,base64:await blob64(photo.blob)});const nextPhoto=await outbox('remove',photo,target);pending=nextPhoto||null;continueQueue=!!pending;draft=null;for(const id of ['preview','photoMeta','filterPanel','review','retry'])$(id).classList.add('hidden');showCounts(result.counts);message(pending?'เก็บภาพก่อนหน้าแล้ว กำลังส่งภาพถัดไป…':'เก็บภาพเรียบร้อยแล้ว ✓')}catch(e){$('retry').classList.remove('hidden');message((e.code==='AUTH'?'กล้องเป็นของรุ่นก่อน ภาพรอส่งยังเก็บอยู่ในเครื่อง กรุณาติดต่อเจ้าของงาน':'ยังส่งไม่สำเร็จ ภาพบันทึกรอส่งในเครื่องแล้ว กลับมาส่งต่อได้เมื่อมีอินเทอร์เน็ต'))}finally{busy=false;$('retry').disabled=false;controls()}if(continueQueue&&!busy)await transmit()}
$('join').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const button=$('join').querySelector('button');button.disabled=true;try{const request=await joinRequest($('nickname').value.trim());const r=await reliable('createCamera',{nickname:request.nickname,accessCode:$('access').value,requestId:request.id});credential=await remember(r.credential);localStorage.setItem(storageKey,JSON.stringify(credential));$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');const c=await reliable('getCamera',{credential});showCounts(c);$('access').value='';message('รับกล้องแล้ว เลือกถ่ายภาพหรือเลือกภาพจากเครื่อง')}catch(e){message(e.message)}finally{busy=false;button.disabled=false;controls()}};
$('start').onclick=start;$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('zoom').oninput=async e=>{const track=stream?.getVideoTracks()[0];if(!track)return;try{await track.applyConstraints({advanced:[{zoom:Number(e.target.value)}]});$('zoomValue').textContent=Number(e.target.value).toFixed(1)+'×'}catch{message('อุปกรณ์นี้ปรับซูมผ่านเว็บไม่ได้')}};$('torch').onclick=async()=>{const track=stream?.getVideoTracks()[0];if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});$('torch').textContent=torchOn?'ปิดไฟช่วยถ่าย':'เปิดไฟช่วยถ่าย'}catch{torchOn=false;message('อุปกรณ์นี้เปิดไฟช่วยถ่ายผ่านเว็บไม่ได้')}};
$('pick').onclick=()=>{if(!busy&&!draft&&!pending)$('filePick').click()};$('filePick').onchange=async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(!file.type.startsWith('image/')){message('กรุณาเลือกไฟล์รูปภาพ');return}busy=true;try{stop();await preview(file);message('เลือกภาพแล้ว เลือกโทนภาพและกด “ใช้ภาพนี้และส่ง”')}catch{draft=null;message('เปิดภาพนี้ไม่ได้ กรุณาเลือกภาพ JPEG, PNG หรือ HEIC อื่น')}finally{busy=false;controls()}};
$('shutter').onclick=async()=>{if(busy)return;busy=true;try{const track=stream.getVideoTracks()[0];let blob;if(window.ImageCapture){try{blob=await new ImageCapture(track).takePhoto()}catch{}}if(!blob){const v=$('video'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);blob=await toBlob(c,settings.jpegQuality)}await preview(blob)}catch(e){message('ถ่ายภาพไม่ได้: '+e.message)}finally{busy=false;controls()}};
for(const [id,p] of Object.entries(FILTERS)){const b=document.createElement('button');b.type='button';b.textContent=p.label;b.dataset.filter=id;b.setAttribute('aria-pressed',id===filter);b.onclick=()=>{filter=id;$('preview').className='f-'+id;document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.filter===id))};$('filters').appendChild(b)}
$('retake').onclick=()=>{draft=null;$('preview').classList.add('hidden');$('photoMeta').classList.add('hidden');$('filterPanel').classList.add('hidden');$('review').classList.add('hidden');controls();message('ถ่ายใหม่ได้ ยังไม่หักสิทธิ์')};$('send').onclick=async()=>{if(!draft||pending||busy)return;busy=true;controls();try{message('กำลังเตรียมภาพ กรุณารอสักครู่…');const ready=await filteredBlob(draft);const queued={id:uuid(),blob:ready,camera:credential.id,event:APP_EVENT};pending=await outbox('put',queued);$('review').classList.add('hidden')}catch(e){message(e.message);busy=false;controls();return}busy=false;await transmit()};$('retry').onclick=transmit;$('newRoll').onclick=async()=>{if(busy||pending||draft||!lastCounts||lastCounts.used!==lastCounts.limit||lastCounts.reserved)return;busy=true;$('newRoll').disabled=true;message('กำลังเตรียมฟิล์มม้วนใหม่…');try{const r=await reliable('createRoll',{credential});credential=await remember(r.credential,credential);localStorage.setItem(storageKey,JSON.stringify(credential));showCounts(await reliable('getCamera',{credential}));message('พร้อมแล้ว ฟิล์มม้วนใหม่มี 36 ภาพ')}catch(e){message(e.message)}finally{busy=false;controls()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
let initRunning=false;
async function init(){if(initRunning)return;initRunning=true;$('reconnect').classList.add('hidden');try{message('กำลังเปิดพื้นที่เก็บภาพในเครื่อง…');credential=await active();if(credential){pending=await outbox('read');$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');if(pending)$('retry').classList.remove('hidden')}message(pending?'กู้ภาพรอส่งแล้ว กำลังเชื่อมต่อระบบ…':'กำลังเชื่อมต่อระบบเก็บภาพ…');settings=await reliable('getSettings',{});if(settings.event!==APP_EVENT)throw new Error('เว็บกำลังอัปเดต กรุณาเปิดใหม่อีกครั้ง');if(credential){showCounts(await reliable('getCamera',{credential}));if(pending)await transmit();else message('พร้อมถ่ายภาพต่อ')}else message('พร้อมรับกล้อง')}catch(e){const network=['TIMEOUT','RETRY','BUSY'].includes(e.code);message((pending?'ภาพรอส่งยังอยู่ในเครื่อง — ':'')+(network?'เชื่อมต่อ Google ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วกดลองเชื่อมต่ออีกครั้ง':e.message));$('reconnect').classList.remove('hidden')}finally{initRunning=false}}
$('reconnect').onclick=()=>init();init();window.addEventListener('online',()=>{if(pending&&!busy)transmit();else if(!settings)init()});
</script></body></html>
