<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First & Dream · Wedding Camera TEST</title>
<style>
:root{--ink:#17362c;--green:#1e6248;--paper:#fffdf4;--sky:#dff3fa;--line:#78917f}*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:system-ui,"Noto Sans Thai",sans-serif}main{width:min(680px,100%);margin:auto;padding:22px 18px 48px}header{text-align:center;margin:10px 0 24px}h1{font-family:Georgia,serif;margin:.2rem;font-size:clamp(2rem,8vw,3.4rem)}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 #b6d4cf;margin-bottom:16px}label{display:block;font-weight:700;margin:12px 0 5px}input,button{font:inherit;width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);padding:10px 14px}button{background:var(--green);color:white;font-weight:800;cursor:pointer}button.secondary{background:transparent;color:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}video,img{display:block;width:100%;border-radius:18px;margin:14px 0;background:#111;max-height:65vh;object-fit:contain}#shutter{width:72px;height:72px;min-height:72px;border:8px solid white;border-radius:50%;margin:-100px auto 40px;position:relative;box-shadow:0 0 0 2px #123;background:#e7cda5}#status{white-space:pre-wrap;background:#fffbea;border-left:5px solid #d9aa52;padding:12px;margin-top:16px}small{display:block;line-height:1.5}.hidden{display:none!important}@media(max-width:480px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><main>
<header><small>รุ่นทดสอบส่วนตัว · ห้ามแจกแขก</small><h1>First &amp; Dream</h1><div>22 พฤศจิกายน 2569</div><p>ช่วยเก็บวันนี้ในมุมของคุณ</p></header>
<section class="card" id="joinCard"><h2>รับกล้องทดสอบ</h2><form id="join"><label for="nickname">ชื่อเล่น</label><input id="nickname" maxlength="40" required><label for="access">รหัสทดสอบ</label><input id="access" type="password" minlength="16" required><button style="margin-top:16px">รับกล้อง</button></form></section>
<section class="card hidden" id="cameraCard"><h2 id="cameraName">กล้องของคุณ</h2><p id="counts"></p><div class="row"><button id="start">เปิดกล้องสด</button><button id="switch" class="secondary" disabled>สลับกล้อง</button></div><video id="video" autoplay playsinline muted class="hidden"></video><button id="shutter" class="hidden" aria-label="ถ่ายภาพ"></button><img id="preview" class="hidden" alt="ภาพที่รอยืนยัน"><div class="row hidden" id="review"><button id="retake" class="secondary">ถ่ายใหม่</button><button id="send">ใช้ภาพนี้และส่ง</button></div><button id="retry" class="hidden" style="margin-top:12px">ตรวจสถานะและลองส่งเดิม</button></section>
<div id="status" role="status">กำลังตรวจระบบ…</div><iframe name="bridgeFrame" id="bridgeFrame" class="hidden" title="ระบบส่งภาพ"></iframe>
</main><script>
const API='https://script.google.com/macros/s/AKfycbynKzbU2pTSvJK0SUauDUQ38xVpzKedlqrregzHTgVevb7drrZeumW1MS_zcgcuO1pY/exec';
const ORIGIN=location.origin, $=id=>document.getElementById(id), errors={CLOSED:'ระบบยังปิดรับภาพ',SETUP:'ระบบยังตั้งค่าไม่ครบ',ACCESS:'รหัสหรือเว็บไซต์ต้นทางไม่ถูกต้อง',NAME:'กรุณากรอกชื่อเล่น',LIMIT:'ใช้สิทธิ์ครบแล้ว',BUSY:'ระบบกำลังประมวลผล',AUTH:'ข้อมูลกล้องไม่ถูกต้อง',IMAGE:'ไฟล์ภาพไม่ถูกต้อง',MISMATCH:'ข้อมูลภาพไม่ตรงกัน',RETRY:'เชื่อมต่อไม่สำเร็จ กรุณาลองอีกครั้ง'};
let settings,credential,stream,draft,pending,busy=false,facing='environment';const waits=new Map();
function message(v){$('status').textContent=v}function uuid(){return crypto.randomUUID()}
window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&& !e.origin.endsWith('.googleusercontent.com'))return;let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch{return}}if(d?.source!=='df-wedding-bridge-v1')return;const w=waits.get(d.requestId);if(w){waits.delete(d.requestId);clearTimeout(w.timer);d.result?.ok?w.resolve(d.result.data):w.reject(new Error(errors[d.result?.code]||errors.RETRY));}});
function rpc(operation,payload={}){return new Promise((resolve,reject)=>{const id=uuid(),form=document.createElement('form');form.method='POST';form.action=API;form.target='bridgeFrame';form.enctype='multipart/form-data';for(const [k,v] of Object.entries({operation,origin:ORIGIN,bridgeRequestId:id,payload:JSON.stringify(payload)})){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)}document.body.appendChild(form);const timer=setTimeout(()=>{waits.delete(id);form.remove();reject(new Error('หมดเวลารอเซิร์ฟเวอร์'))},45000);waits.set(id,{resolve:v=>{form.remove();resolve(v)},reject:e=>{form.remove();reject(e)},timer});form.submit();});}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').classList.add('hidden');$('shutter').classList.add('hidden');$('switch').disabled=true}
function showCounts(c){$('counts').textContent=`เหลือ ${c.remaining} / ${c.limit} ภาพ · ถ่ายเพิ่มได้ ${c.available}`;$('cameraName').textContent='กล้องของ '+c.nickname}
async function start(){try{if(busy||draft||pending)return;stop();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing}}});$('video').srcObject=stream;await $('video').play();$('video').classList.remove('hidden');$('shutter').classList.remove('hidden');$('switch').disabled=false;message('เปิดกล้องสดแล้ว')}catch(e){stop();message('เปิดกล้องไม่ได้: '+e.name+' กรุณาตรวจสิทธิ์กล้องของเบราว์เซอร์')}}
function blob64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function preview(blob){draft=blob;stop();$('preview').src=URL.createObjectURL(blob);$('preview').classList.remove('hidden');$('review').classList.remove('hidden');message('ตรวจภาพก่อนยืนยัน การถ่ายใหม่ยังไม่หักสิทธิ์')}
async function transmit(){if(!pending||busy)return;busy=true;try{const r=await rpc('uploadPhoto',{credential,requestId:pending.id,base64:await blob64(pending.blob)});pending=null;draft=null;localStorage.removeItem('dfPendingMeta');$('preview').classList.add('hidden');$('review').classList.add('hidden');$('retry').classList.add('hidden');showCounts(r.counts);message('บันทึกภาพใน Drive สำเร็จ')}catch(e){$('retry').classList.remove('hidden');message(e.message+'\nภาพยังรอส่งเดิม กรุณาอย่าถ่ายเพิ่ม')}finally{busy=false}}
$('join').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('createCamera',{nickname:$('nickname').value,accessCode:$('access').value});credential=r.credential;localStorage.setItem('dfCredential',JSON.stringify(credential));$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');showCounts(r.counts);$('access').value='';message('รับกล้องแล้ว กดเปิดกล้องสด')}catch(e){message(e.message)}};
$('start').onclick=start;$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('shutter').onclick=()=>{const v=$('video'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(preview,'image/jpeg',settings.jpegQuality)};$('retake').onclick=()=>{draft=null;$('preview').classList.add('hidden');$('review').classList.add('hidden');message('ถ่ายใหม่ได้ ยังไม่หักสิทธิ์')};$('send').onclick=async()=>{if(!draft||pending)return;pending={id:uuid(),blob:draft};$('review').classList.add('hidden');$('retry').classList.remove('hidden');await transmit()};$('retry').onclick=transmit;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
(async()=>{try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('เบราว์เซอร์นี้ไม่รองรับกล้องสด');settings=await rpc('getSettings');const saved=localStorage.getItem('dfCredential');if(saved){credential=JSON.parse(saved);const c=await rpc('getCamera',{credential});$('joinCard').classList.add('hidden');$('cameraCard').classList.remove('hidden');showCounts(c);message('กลับมาใช้กล้องเดิมได้แล้ว')}else message('พร้อมรับกล้องทดสอบ')}catch(e){message(e.message)}})();
</script></body></html>
